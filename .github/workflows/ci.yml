name: CI

# Telegram CRM — continuous integration.
# Runs on every push and every pull request. Merge policy: a PR may only be merged
# when every job is green.
#
# P0 note: the backend solution and the frontend package do not exist yet, so each
# job detects its project and exits with a ::notice instead of failing. The guards
# disappear naturally once P1/P3 land the real projects.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend project
        id: detect
        run: |
          if [ -f backend/TelegramCrm.sln ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=backend-build skipped::backend/TelegramCrm.sln not found (P0 skeleton)."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK version
        if: steps.detect.outputs.present == 'true'
        run: dotnet --version

      - name: Cache NuGet packages
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        if: steps.detect.outputs.present == 'true'
        run: dotnet restore backend/TelegramCrm.sln

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: dotnet build backend/TelegramCrm.sln --no-restore -c Release

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: >
          dotnet test backend/TelegramCrm.sln
          --no-build
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/artifacts/test-results

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=frontend-build skipped::frontend/package.json not found (P0 skeleton)."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: pnpm build

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect projects
        id: detect
        run: |
          [ -f backend/TelegramCrm.sln ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          if [ ! -f backend/TelegramCrm.sln ] && [ ! -f frontend/package.json ]; then
            echo "::notice title=lint skipped::no backend solution or frontend package yet (P0 skeleton)."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.backend == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: dotnet format (verify only)
        if: steps.detect.outputs.backend == 'true'
        run: dotnet format backend/TelegramCrm.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: Setup pnpm
        if: steps.detect.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.detect.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm lint

  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect contract inputs
        id: detect
        run: |
          if [ -f contracts/openapi.json ] && [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=contract-check skipped::contracts/openapi.json or frontend/package.json missing (P0 skeleton)."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate types and diff
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          pnpm exec openapi-typescript ../contracts/openapi.json -o src/types/api.d.ts
          if ! git diff --exit-code -- src/types/api.d.ts; then
            echo "::error title=OpenAPI types out of sync::frontend/src/types/api.d.ts does not match contracts/openapi.json. Run 'pnpm gen:api' and commit the result."
            exit 1
          fi

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          # Dummy values: `config` only needs the required variables to be set.
          export POSTGRES_PASSWORD=ci-dummy-password
          export TELEGRAM_BOT_TOKEN=000000000:ci-dummy-token
          export JWT_SECRET=ci-dummy-secret-at-least-32-characters-long
          docker compose -f infrastructure/docker-compose.yml config --quiet
          echo "docker-compose.yml is valid."

      - name: Validate nginx configs (syntax)
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm -v "$PWD/infrastructure/docker/web-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  ci-status:
    name: ci-status
    if: always()
    needs: [backend-build, frontend-build, lint, contract-check, compose-config]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "backend-build:   ${{ needs.backend-build.result }}"
          echo "frontend-build:  ${{ needs.frontend-build.result }}"
          echo "lint:            ${{ needs.lint.result }}"
          echo "contract-check:  ${{ needs.contract-check.result }}"
          echo "compose-config:  ${{ needs.compose-config.result }}"
          for r in "${{ needs.backend-build.result }}" "${{ needs.frontend-build.result }}" \
                   "${{ needs.lint.result }}" "${{ needs.contract-check.result }}" \
                   "${{ needs.compose-config.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error title=CI failed::at least one job did not succeed."
              exit 1
            fi
          done
          echo "All CI jobs passed."
