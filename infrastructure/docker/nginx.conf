# =============================================================================
# Telegram CRM — reverse proxy (the `proxy` service)
# Mounted at /etc/nginx/conf.d/default.conf
#
# Single origin for the browser:
#   /api/*  -> api:8080   (ASP.NET Core)
#   /*      -> web:80     (static frontend, SPA fallback handled there)
# =============================================================================

upstream api_upstream {
    server api:8080;
    keepalive 32;
}

upstream web_upstream {
    server web:80;
    keepalive 16;
}

# Basic abuse protection for the API surface
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Telegram Mini Apps are served over HTTPS; the TLS terminator in front of
    # this container sets these headers.
    client_max_body_size 12m;
    server_tokens off;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Never cache API responses at the edge
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # --- Frontend -----------------------------------------------------------
    location / {
        proxy_pass         http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Health -------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
