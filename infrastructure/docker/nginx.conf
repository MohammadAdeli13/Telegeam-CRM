# =============================================================================
# Telegram CRM — reverse proxy (the `proxy` service)
# Mounted at /etc/nginx/conf.d/default.conf
#
# Single origin for the browser:
#   /api/*    -> api:8080   (ASP.NET Core)
#   /files/*  -> api:8080   (Tenant-namespaced uploaded product images)
#   /*        -> web:80     (static frontend, SPA fallback handled there)
# =============================================================================

upstream api_upstream {
    server api:8080;
    keepalive 32;
}

upstream web_upstream {
    server web:80;
    keepalive 16;
}

# --- Real client IP (F-05) ---------------------------------------------------
# NOTE: `set_real_ip_from` must be narrowed to the TLS terminator's CIDR range
# in production. 0.0.0.0/0 is used here because the terminator address is not
# known at build time; trusting every peer is only acceptable because the proxy
# port is not exposed directly to the internet.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Basic abuse protection for the API surface (must come AFTER real_ip_* so the
# zone keys on the real client address).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 12m;
    server_tokens off;

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        include /etc/nginx/conf.d/security-headers.conf;

        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Never cache API responses at the edge
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # --- Uploaded Media (/files/*) ------------------------------------------
    location /files/ {
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=86400" always;
    }

    # --- Frontend -----------------------------------------------------------
    location / {
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_pass         http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Health -------------------------------------------------------------
    location = /healthz {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        return 200 "ok
";
        add_header Content-Type text/plain;
    }
}
