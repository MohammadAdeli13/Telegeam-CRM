# =============================================================================
# Telegram CRM — static frontend server (the `web` service)
# Mounted at /etc/nginx/conf.d/default.conf inside the web container.
# Serves the Vite build output with SPA history fallback.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # Hashed build assets are immutable
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never cache the entry document
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA history fallback
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
