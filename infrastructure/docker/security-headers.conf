# =============================================================================
# Telegram CRM — shared security headers
#
# Included by every `location` block in nginx.conf (proxy) and web-nginx.conf
# (web). nginx drops inherited `add_header` directives as soon as a location
# declares its own, so this file MUST be included in each location that adds
# any header of its own (e.g. Cache-Control).
#
# Framing policy: Telegram Mini Apps are rendered inside Telegram clients, so
# `X-Frame-Options` is intentionally NOT used (it cannot express an allow-list
# and would break the Mini App). Framing is restricted with CSP
# `frame-ancestors` instead.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
