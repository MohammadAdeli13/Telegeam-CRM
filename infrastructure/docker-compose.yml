# =============================================================================
# Telegram CRM — local / single-host stack
#
#   docker compose -f infrastructure/docker-compose.yml --env-file .env config
#   docker compose -f infrastructure/docker-compose.yml --env-file .env up -d --build --wait
#
# Only `proxy` publishes a host port, so the browser sees a single origin and
# no CORS configuration is needed.
# =============================================================================

name: telegram-crm

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_crm}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation for Persian/English mixed text
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # API — ASP.NET Core 10
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: telegram-crm-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-telegram_crm};Username=${POSTGRES_USER:-telegram_crm};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      Telegram__MiniAppBaseUrl: ${TELEGRAM_MINI_APP_BASE_URL:-http://localhost:8080}
      Telegram__EnableOutboxWorker: ${TELEGRAM_ENABLE_OUTBOX_WORKER:-true}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${JWT_ISSUER:-telegram-crm}
      Jwt__Audience: ${JWT_AUDIENCE:-telegram-crm-web}
      Auth__JwtLifetimeMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      FileStorage__RootPath: /app/storage
      FileStorage__PublicBaseUrl: /files
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Web — static frontend (nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: telegram-crm-web:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Proxy — single public entry point
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - backend

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  backend:
    driver: bridge
